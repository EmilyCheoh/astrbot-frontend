<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Den</title>
  <style>
    .hidden {
      display: none !important
    }
  </style>
  <link rel="stylesheet" href="/static/style.css?v=20260824-2">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
</head>

<body>
  <!-- Login -->
  <div id="login">
    <div class="login-box">
      <h2>Den</h2>
      <input type="password" id="token-input" placeholder="Token" autofocus>
      <button id="login-btn">Enter</button>
    </div>
  </div>

  <!-- Chat -->
  <div id="chat" class="hidden chat-layout">
    <header class="chat-header">
      <div class="header-left">
        <button id="panel-toggle" class="icon-btn" title="Conversations">&#9776;</button>
      </div>
      <span class="header-title">Den</span>
      <div class="header-right">
        <button id="font-toggle" class="icon-btn" title="Font: serif">Aa</button>
        <button id="theme-toggle" class="icon-btn" title="Theme: auto"></button>
        <div class="more-menu-wrapper">
          <button id="more-menu-btn" class="icon-btn more-dots" title="More">&middot;&middot;&middot;</button>
          <div id="more-menu" class="more-menu hidden">
            <button id="export-md-btn" class="more-menu-item">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
              </svg>
              Export as Markdown
            </button>
            <a href="https://rl.littlebatcat.uk" target="_blank" rel="noopener" class="more-menu-item">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                <polyline points="15 3 21 3 21 9" />
                <line x1="10" y1="14" x2="21" y2="3" />
              </svg>
              Go to Recursion Log
            </a>
          </div>
        </div>
      </div>
    </header>

    <!-- Slide-out conversation panel -->
    <div id="panel-overlay" class="panel-overlay hidden"></div>
    <aside id="conv-panel" class="conv-panel">
      <button id="new-conv-btn" class="new-conv-btn">+ New conversation</button>
      <button id="search-btn" class="search-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        Search
      </button>
      <div id="conv-list" class="conv-list"></div>
      <div id="pagination" class="pagination"></div>
    </aside>

    <!-- Search overlay -->
    <div id="search-overlay" class="search-overlay hidden">
      <div class="search-overlay-inner">
        <div class="search-header">
          <div class="search-mode-row">
            <button class="search-mode-btn active" data-mode="title">Title</button>
            <button class="search-mode-btn" data-mode="content">Content</button>
            <button class="search-mode-btn" data-mode="date">Date</button>
          </div>
          <div id="search-input-row" class="search-input-row">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input type="text" id="search-input" placeholder="Search titles..." autocomplete="off">
          </div>
          <div id="search-date-inputs" class="search-date-inputs hidden">
            <div class="search-date-row">
              <input type="date" id="search-date-from">
              <span class="search-date-sep">&ndash;</span>
              <input type="date" id="search-date-to">
            </div>
            <button id="search-date-apply" class="search-date-apply">Apply</button>
          </div>
        </div>
        <div id="search-results" class="search-results"></div>
      </div>
    </div>

    <main class="chat-scroll" id="chat-scroll">
      <div id="messages" class="chat-content"></div>
      <div id="thinking-indicator" class="thinking-indicator hidden">
        <span></span><span></span><span></span>
      </div>
    </main>

    <footer class="composer-section">
      <div class="composer">
        <div id="img-preview" class="img-preview hidden"></div>
        <div class="composer-row">
          <button id="attach-btn" class="attach-btn" title="Attach image">+</button>
          <input type="file" id="file-input" accept="image/*" multiple class="hidden">
          <textarea id="msg-input" placeholder="Talk to me..." rows="1"></textarea>
          <button id="send-btn" class="send-btn" title="Send">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5" />
              <polyline points="5 12 12 5 19 12" />
            </svg>
          </button>
        </div>
      </div>
    </footer>
  </div>

  <script src="/static/app.js?v=20260824-2"></script>
</body>

</html>
