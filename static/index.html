<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Den</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Login -->
  <div id="login">
    <div class="login-box">
      <h2>Den</h2>
      <input type="password" id="token-input" placeholder="Token" autofocus>
      <button id="login-btn">Enter</button>
    </div>
  </div>

  <!-- Chat -->
  <div id="chat" class="hidden">
    <div id="messages"></div>
    <div id="status-bar" class="hidden">thinking...</div>
    <div id="input-area">
      <textarea id="msg-input" placeholder="Say something..." rows="1"></textarea>
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
