<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Den</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
</head>
<body>
  <!-- Login -->
  <div id="login">
    <div class="login-box">
      <h2>Den</h2>
      <input type="password" id="token-input" placeholder="Token" autofocus>
      <button id="login-btn">Enter</button>
    </div>
  </div>

  <!-- Chat -->
  <div id="chat" class="hidden chat-layout">
    <header class="chat-header">
      <div class="header-spacer"></div>
      <span class="header-title">Den</span>
      <button id="theme-toggle" class="icon-btn" title="Toggle theme">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </header>

    <main class="chat-scroll" id="chat-scroll">
      <div id="messages" class="chat-content"></div>
      <div id="thinking-indicator" class="thinking-indicator hidden">
        <span></span><span></span><span></span>
      </div>
    </main>

    <footer class="composer-section">
      <div class="composer">
        <textarea id="msg-input" placeholder="Reply..." rows="1"></textarea>
        <button id="send-btn" class="send-btn" title="Send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"/>
            <polyline points="5 12 12 5 19 12"/>
          </svg>
        </button>
      </div>
    </footer>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
