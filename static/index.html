<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Den</title>
  <style>
    .hidden {
      display: none !important
    }
  </style>
  <!-- CSS modules — load order matters -->
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/messages.css">
  <link rel="stylesheet" href="/static/css/blocks.css">
  <link rel="stylesheet" href="/static/css/composer.css">
  <link rel="stylesheet" href="/static/css/conversations.css">
  <link rel="stylesheet" href="/static/css/overlays.css">
  <link rel="stylesheet" href="/static/css/bookmarks.css">
  <link rel="stylesheet" href="/static/css/selection.css">
  <!-- Third-party libs (classic scripts — available as window globals) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
</head>

<body>
  <!-- Login -->
  <div id="login">
    <div class="login-box">
      <h2>Den</h2>
      <input type="password" id="token-input" placeholder="Token" autofocus>
      <button id="login-btn">Enter</button>
    </div>
  </div>

  <!-- Chat -->
  <div id="chat" class="hidden chat-layout">
    <header class="chat-header">
      <div class="header-left">
        <button id="panel-toggle" class="icon-btn" title="Conversations">&#9776;</button>
      </div>
      <span class="header-title">Den</span>
      <div class="header-right">
        <button id="font-toggle" class="icon-btn" title="Font: serif">Aa</button>
        <button id="theme-toggle" class="icon-btn" title="Theme: auto"></button>
        <div class="more-menu-wrapper">
          <button id="more-menu-btn" class="icon-btn more-dots" title="More">&middot;&middot;&middot;</button>
          <div id="more-menu" class="more-menu hidden">
            <button id="more-pin-btn" class="more-menu-item">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <polygon
                  points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
              </svg>
              Star
            </button>
            <button id="more-bookmarks-btn" class="more-menu-item">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
              </svg>
              Bookmarks
            </button>
            <div class="more-menu-separator"></div>
            <button id="more-delete-btn" class="more-menu-item danger">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6" />
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
              </svg>
              Delete
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Slide-out conversation panel -->
    <div id="panel-overlay" class="panel-overlay hidden"></div>
    <aside id="conv-panel" class="conv-panel">
      <button id="new-conv-btn" class="new-conv-btn">+ New conversation</button>
      <button id="search-btn" class="search-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        Search
      </button>
      <div id="conv-list" class="conv-list">
        <div id="conv-sentinel" class="conv-sentinel"></div>
      </div>
      <div id="conv-loading" class="conv-loading hidden">Loading...</div>
      <div id="conv-end" class="conv-end hidden">No more conversations</div>
    </aside>

    <!-- Search overlay -->
    <div id="search-overlay" class="search-overlay hidden">
      <div class="search-overlay-inner">
        <div class="search-header">
          <div class="search-mode-row">
            <button class="search-mode-btn active" data-mode="content">Content</button>
            <button class="search-mode-btn" data-mode="cot">CoT</button>
            <button class="search-mode-btn" data-mode="title">Title</button>
            <button class="search-mode-btn" data-mode="date">Date</button>
          </div>
          <div id="search-input-row" class="search-input-row">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input type="text" id="search-input" placeholder="Search content..." autocomplete="off">
          </div>
          <div id="search-date-inputs" class="search-date-inputs hidden">
            <div class="search-date-row">
              <input type="date" id="search-date-from">
              <span class="search-date-sep">&ndash;</span>
              <input type="date" id="search-date-to">
            </div>
            <button id="search-date-apply" class="search-date-apply">Apply</button>
          </div>
        </div>
        <div id="search-results" class="search-results"></div>
      </div>
    </div>

    <main class="chat-scroll" id="chat-scroll">
      <div id="messages" class="chat-content"></div>
      <div id="thinking-indicator" class="thinking-indicator hidden">
        <span></span><span></span><span></span>
      </div>
    </main>

    <button id="scroll-bottom-btn" class="scroll-bottom-btn" title="Scroll to bottom">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19" />
        <polyline points="19 12 12 19 5 12" />
      </svg>
    </button>

    <footer class="composer-section">
      <div class="composer">
        <div id="img-preview" class="img-preview hidden"></div>
        <div id="quote-preview" class="quote-preview hidden">
          <span id="quote-preview-source" class="quote-preview-source"></span>
          <span id="quote-preview-text" class="quote-preview-text"></span>
          <button id="quote-preview-close" class="quote-preview-close">&times;</button>
        </div>
        <div class="composer-row">
          <button id="attach-btn" class="attach-btn" title="Attach files">+</button>
          <input type="file" id="file-input" multiple class="hidden">
          <textarea id="msg-input" placeholder="Talk to me..." rows="1"></textarea>
          <button id="send-btn" class="send-btn" title="Send">
            <svg class="send-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5" />
              <polyline points="5 12 12 5 19 12" />
            </svg>
            <svg class="stop-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <rect x="4" y="4" width="16" height="16" rx="2" />
            </svg>
          </button>
        </div>
      </div>
    </footer>

    <!-- Bookmarks page overlay -->
    <div id="bookmarks-page" class="bookmarks-page hidden">
      <div class="bookmarks-header">
        <div class="bookmarks-header-left">
          <button id="bookmarks-search-toggle" class="icon-btn bookmarks-icon-btn" title="Search">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
          </button>
          <button id="bookmarks-font-toggle" class="icon-btn bookmarks-icon-btn"
            title="Bookmarks font: Georgia">Aa</button>
          <button id="bookmarks-label-mgr-btn" class="icon-btn bookmarks-icon-btn" title="Manage labels">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
            </svg>
          </button>
        </div>
        <button id="bookmarks-close-btn" class="bookmarks-close-btn">&times;</button>
      </div>
      <!-- Collapsible search area -->
      <div id="bookmarks-search-panel" class="bookmarks-search-panel hidden">
        <div class="bookmarks-search-row">
          <input type="text" id="bookmarks-search" placeholder="Search bookmarks..." autocomplete="off">
        </div>
        <div class="bookmarks-search-dates">
          <input type="date" id="bookmarks-date-from">
          <span class="bookmarks-date-sep">&ndash;</span>
          <input type="date" id="bookmarks-date-to">
        </div>
        <div class="bookmarks-search-actions">
          <button id="bookmarks-search-submit" class="bookmarks-search-action-btn">Search</button>
          <button id="bookmarks-search-clear" class="bookmarks-search-action-btn">Clear</button>
        </div>
        <div id="bookmarks-search-error" class="bookmarks-search-error hidden"></div>
      </div>
      <div class="bookmarks-controls-row">
        <div class="bookmarks-view-group">
          <button id="bookmarks-view-grouped" class="bookmarks-view-btn active" data-view="grouped">By
            Conversation</button>
          <button id="bookmarks-view-newest" class="bookmarks-view-btn" data-view="newest">Newest</button>
          <button id="bookmarks-view-oldest" class="bookmarks-view-btn" data-view="oldest">Oldest</button>
        </div>
        <div class="bookmarks-label-filter-wrapper">
          <button id="bookmarks-label-filter-btn" class="bookmarks-label-filter-btn">ALL &#9662;</button>
          <div id="bookmarks-label-dropdown" class="bookmarks-label-dropdown hidden"></div>
        </div>
      </div>
      <div id="bookmarks-list" class="bookmarks-list"></div>
      <div id="bookmarks-empty" class="bookmarks-empty hidden">No bookmarks yet.</div>
      <div id="bookmarks-no-results" class="bookmarks-no-results hidden">No results.</div>
      <div id="bookmarks-loading" class="bookmarks-loading hidden">Loading...</div>
    </div>
  </div>

  <!-- Note popover -->
  <div id="note-popover" class="note-popover hidden">
    <div id="note-popover-label-picker" class="note-popover-label-picker"></div>
    <textarea id="note-popover-input" placeholder="Add a note..." rows="2"></textarea>
    <div class="note-popover-actions">
      <button id="note-popover-cancel">Cancel</button>
      <button id="note-popover-save">Save</button>
    </div>
  </div>

  <!-- Selection menu -->
  <div id="selection-menu" class="selection-menu hidden">
    <button id="sel-menu-bookmark">&#9734; Bookmark</button>
    <button id="sel-menu-cite">&#10077; Cite</button>
  </div>

  <!-- JS entry point — ES module -->
  <script type="module" src="/static/js/markdown.js"></script>
  <script type="module" src="/static/js/main.js"></script>
</body>

</html>
