<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Den</title>
  <style>
    .hidden {
      display: none !important
    }
  </style>
  <link rel="stylesheet" href="/static/style.css?v=20260823-1">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
</head>

<body>
  <!-- Login -->
  <div id="login">
    <div class="login-box">
      <h2>Den</h2>
      <input type="password" id="token-input" placeholder="Token" autofocus>
      <button id="login-btn">Enter</button>
    </div>
  </div>

  <!-- Chat -->
  <div id="chat" class="hidden chat-layout">
    <header class="chat-header">
      <div class="header-left">
        <button id="panel-toggle" class="icon-btn" title="Conversations">&#9776;</button>
      </div>
      <span class="header-title">Den</span>
      <div class="header-right">
        <button id="font-toggle" class="icon-btn" title="Font: serif">Aa</button>
        <button id="theme-toggle" class="icon-btn" title="Theme: auto"></button>
      </div>
    </header>

    <!-- Slide-out conversation panel -->
    <div id="panel-overlay" class="panel-overlay hidden"></div>
    <aside id="conv-panel" class="conv-panel">
      <button id="new-conv-btn" class="new-conv-btn">+ New conversation</button>
      <div id="conv-list" class="conv-list"></div>
    </aside>

    <main class="chat-scroll" id="chat-scroll">
      <div id="messages" class="chat-content"></div>
      <div id="thinking-indicator" class="thinking-indicator hidden">
        <span></span><span></span><span></span>
      </div>
    </main>

    <footer class="composer-section">
      <div class="composer">
        <div id="img-preview" class="img-preview hidden"></div>
        <div class="composer-row">
          <button id="attach-btn" class="attach-btn" title="Attach image">+</button>
          <input type="file" id="file-input" accept="image/*" multiple class="hidden">
          <textarea id="msg-input" placeholder="Talk to me..." rows="1"></textarea>
          <button id="send-btn" class="send-btn" title="Send">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5" />
              <polyline points="5 12 12 5 19 12" />
            </svg>
          </button>
        </div>
      </div>
    </footer>
  </div>

  <script src="/static/app.js?v=20260823-1"></script>
</body>

</html>
